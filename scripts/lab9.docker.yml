# Lab 9 - deploy the whole insurance system with Docker Compose.
#   docker compose -p insurance-lab9 -f scripts/lab9.docker.yml up -d --build --wait --wait-timeout 600
# Service names equal the host names used in every appsettings.docker.json / nginx.conf of the solution.
# Ports are published on 127.0.0.1 only. PricingService (5040) and PostgreSQL stay inside the Docker network.

x-app: &app
  image: insurance-lab9:latest
  build:
    context: ..
    dockerfile: scripts/lab9.Dockerfile
  restart: on-failure
  environment: &app-env
    ASPNETCORE_ENVIRONMENT: docker
    DOTNET_ENVIRONMENT: docker
    Logging__EventLog__LogLevel__Default: None

x-app-health: &app-health
  interval: 5s
  timeout: 10s
  retries: 60
  start_period: 20s

x-needs-eureka: &needs-eureka
  eureka-server:
    condition: service_healthy

services:
  # ---------- infrastructure ----------
  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile.windows
    image: lab-eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 5s
      timeout: 5s
      retries: 60

  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile.windows
    image: lab-postgres:16
    environment:
      POSTGRES_PASSWORD: lab_pass
    volumes:
      - lab9_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_netmicro_policy"]
      interval: 5s
      timeout: 5s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - lab9_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60

  rabbit:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.config
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq-isolated.conf:/etc/rabbitmq/rabbitmq.config:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 40

  # ---------- microservices ----------
  dotnet-auth-service:
    <<: *app
    working_dir: /src/AuthService
    command: ["dotnet", "bin/Release/net8.0/AuthService.dll", "--urls", "http://0.0.0.0:6060"]
    ports:
      - "127.0.0.1:6060:6060"
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:6060/api/User"]

  dotnet-product-service:
    <<: *app
    working_dir: /src/ProductService
    command: ["dotnet", "bin/Release/net8.0/ProductService.dll", "--urls", "http://0.0.0.0:5030"]
    environment:
      <<: *app-env
      Eureka__Instance__Port: "5030"
    ports:
      - "127.0.0.1:5030:5030"
    depends_on:
      <<: *needs-eureka
      dotnet-auth-service:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:5030/api/Products/TRI >/dev/null"]

  dotnet-pricing-service:
    <<: *app
    working_dir: /src/PricingService
    command: ["dotnet", "bin/Release/net8.0/PricingService.dll", "--urls", "http://0.0.0.0:5040"]
    environment:
      <<: *app-env
      Urls: "http://0.0.0.0:5040"
      Eureka__Instance__Port: "5040"
    depends_on:
      <<: *needs-eureka
      postgres:
        condition: service_healthy
      dotnet-auth-service:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5040/"]

  dotnet-policy-service:
    <<: *app
    working_dir: /src/PolicyService
    command: ["dotnet", "bin/Release/net8.0/PolicyService.dll", "--urls", "http://0.0.0.0:5050"]
    environment:
      <<: *app-env
      Eureka__Instance__Port: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      <<: *needs-eureka
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      dotnet-pricing-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5050/"]

  dotnet-policy-search-service:
    <<: *app
    working_dir: /src/PolicySearchService
    command: ["dotnet", "bin/Release/net8.0/PolicySearchService.dll", "--urls", "http://0.0.0.0:5065"]
    environment:
      <<: *app-env
      Eureka__Instance__Port: "5065"
    ports:
      - "127.0.0.1:5065:5065"
    depends_on:
      <<: *needs-eureka
      elasticsearch:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5065/"]

  dotnet-payment-service:
    <<: *app
    working_dir: /src/PaymentService
    command: ["dotnet", "bin/Release/net8.0/PaymentService.dll", "--urls", "http://0.0.0.0:5070"]
    environment:
      <<: *app-env
      Eureka__Client__ServiceUrl: "http://eureka-server:8761/eureka/"
      Eureka__Instance__HostName: dotnet-payment-service
      Eureka__Instance__Port: "5070"
      BackgroundJobs__InPaymentFileFolder: /tmp/lab9-bank-statements
    ports:
      - "127.0.0.1:5070:5070"
    depends_on:
      <<: *needs-eureka
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5070/"]

  dotnet-dashboard-service:
    <<: *app
    working_dir: /src/DashboardService
    command: ["dotnet", "bin/Release/net8.0/DashboardService.dll", "--urls", "http://0.0.0.0:5035"]
    environment:
      <<: *app-env
      Eureka__Instance__Port: "5035"
    ports:
      - "127.0.0.1:5035:5035"
    depends_on:
      <<: *needs-eureka
      elasticsearch:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:5035/"]

  dotnet-chat-service:
    <<: *app
    working_dir: /src/ChatService
    command: ["dotnet", "bin/Release/net8.0/ChatService.dll", "--urls", "http://0.0.0.0:4099"]
    environment:
      <<: *app-env
      Eureka__Instance__Port: "4099"
    ports:
      - "127.0.0.1:4099:4099"
    depends_on:
      <<: *needs-eureka
      rabbit:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4099/"]

  dotnet-agent-portal-gateway:
    <<: *app
    working_dir: /src/AgentPortalApiGateway
    command: ["dotnet", "bin/Release/net8.0/AgentPortalApiGateway.dll"]
    environment:
      <<: *app-env
      ASPNETCORE_URLS: "http://0.0.0.0:8099"
    ports:
      - "127.0.0.1:8099:8099"
    depends_on:
      <<: *needs-eureka
      dotnet-product-service:
        condition: service_healthy
      dotnet-policy-service:
        condition: service_healthy
      dotnet-policy-search-service:
        condition: service_healthy
      dotnet-payment-service:
        condition: service_healthy
      dotnet-dashboard-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8099/"]

  # ---------- web client (Blazor WebAssembly, served by the .NET dev server) ----------
  web:
    <<: *app
    working_dir: /src/BlazorWasmClient
    command: ["dotnet", "run", "-c", "Release", "--no-build", "--no-restore", "--no-launch-profile", "--urls", "http://0.0.0.0:5081"]
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:5081:5081"
    depends_on:
      dotnet-agent-portal-gateway:
        condition: service_healthy
      dotnet-chat-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:5081/ >/dev/null"]

volumes:
  lab9_pgdata:
  lab9_esdata:

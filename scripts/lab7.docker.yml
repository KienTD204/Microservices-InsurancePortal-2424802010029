services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lab7_payments
      POSTGRES_USER: lab7_user
      POSTGRES_PASSWORD: lab7_pass
    volumes:
      - lab7_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab7_user -d lab7_payments"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbit:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.config
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - ./rabbitmq-isolated.conf:/etc/rabbitmq/rabbitmq.config:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
  payment:
    image: insurance-lab7:verified
    working_dir: /src/PaymentService
    command: ["dotnet", "bin/Release/net8.0/PaymentService.dll", "--urls", "http://0.0.0.0:5070"]
    environment:
      ConnectionStrings__PgConnection: "Host=postgres;Port=5432;Database=lab7_payments;Username=lab7_user;Password=lab7_pass"
      BackgroundJobs__HangfireConnectionStringName: "Host=postgres;Port=5432;Database=lab7_payments;Username=lab7_user;Password=lab7_pass"
      BackgroundJobs__InPaymentFileFolder: /tmp/lab7-bank-statements
    ports:
      - "127.0.0.1:15070:5070"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5070/api/Payment/accounts/POLICY_1 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
  product:
    image: insurance-lab7:verified
    working_dir: /src/ProductService
    command: ["dotnet", "bin/Release/net8.0/ProductService.dll", "--urls", "http://0.0.0.0:5030"]
    ports:
      - "127.0.0.1:15030:5030"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5030/api/Products/TRI >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
  verify:
    profiles: ["verification"]
    build:
      context: ..
      dockerfile: tools/Lab7.Verifier/Dockerfile
    image: insurance-lab7:verified
    volumes:
      - ../submission/lab7/evidence:/src/submission/lab7/evidence
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  lab7_pgdata:
